services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uw_api_keys
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.231.0/24
