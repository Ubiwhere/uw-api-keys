[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "uw-api-keys"
version = "0.1.0"
authors = [
  { name="Ubiwhere", email="hello@ubiwhere.com"},
]
description = "Highly customisable and dead-simple API keys for Django REST managed in Django Admin"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[project.urls]
"Homepage" = "https://github.com/Ubiwhere/uw-api-keys"
"Bug Tracker" = "https://github.com/Ubiwhere/uw-api-keys/issues"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
[project.optional-dependencies]
test = [
  "django>=4.2,<6.0",
  "pytest>=8",
  "pytest-django>=4.8",
  "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
